<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>どんぐりAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1b2a; /* 背景のフォールバック色 */
        }
        /* アニメーション用キャンバス */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* チャット画面のiframe */
        iframe {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            border: none;
            background: transparent; /* 背景を透明にする */
        }
    </style>
</head>
<body>

    <!-- 粒子アニメーション背景 -->
    <canvas id="bg-canvas"></canvas>

    <!-- どんぐりAI チャット画面 -->
    <iframe
      src="https://udify.app/chat/mPgVLVub61o0rbhD"
      allow="microphone;clipboard-write">
    </iframe>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // 粒子の設定
        const particleCount = 65;
        const particles = [];

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + 10;
                this.radius = Math.random() * 2 + 0.8; // 粒子の大きさ
                this.speedY = Math.random() * 0.6 + 0.2; // 上昇速度
                this.speedX = (Math.random() - 0.5) * 0.3; // 横揺れ
                this.opacity = Math.random() * 0.7 + 0.3;
                this.fadeSpeed = Math.random() * 0.005 + 0.002;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;

                // 画面外（上部）に出たら画面下部へ再配置
                if (this.y < -10) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 230, ${this.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = "rgba(255, 255, 200, 0.8)";
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            // 背景の深い夜空グラデーションを描画
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#0a0e1a');
            gradient.addColorStop(0.6, '#101c33');
            gradient.addColorStop(1, '#1b2a4a');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // 粒子の更新と描画
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
