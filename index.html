<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>どんぐりAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #171717; /* 全体になじむダーク背景 */
        }
        /* チャット画面の表示領域 */
        .chat-container {
            width: 100%;
            height: 100vh;
            will-change: transform;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <iframe
          src="https://udify.app/chat/mPgVLVub61o0rbhD"
          allow="microphone;clipboard-write">
        </iframe>
    </div>

</body>
</html>
